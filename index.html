<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111827'/><circle cx='50' cy='50' r='35' fill='%23ef4444'/><polygon points='50,20 65,80 20,40 80,40 35,80' fill='%23fbbf24'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>THE FACTORY FLOOR | Isaac × shapez × Pizza Tower</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        margin: 0;
        padding: 0;
      }
      body, html {
        background-color: #080b11;
        color: #e2e8f0;
        font-family: 'Courier New', Courier, monospace, monospace;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      #canvas-wrapper {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      canvas#gameCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }
      .crt-overlay {
        pointer-events: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.18) 50%),
                    radial-gradient(circle at center, transparent 75%, rgba(0, 0, 0, 0.4) 100%);
        background-size: 100% 4px, 100% 100%;
        opacity: 0.6;
      }

    </style>
  </head>
  <body>
    <div id="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>
      <div class="crt-overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
